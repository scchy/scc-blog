name: Sync to Dev.to & Juejin

on:
  push:
    branches: [main]
    paths:
      - 'src/content/blog/**'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Dev.to 直接发布（true=发布, false=草稿）'
        required: false
        default: 'true'
        type: boolean

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync to Dev.to (English .en.md)
        env:
          DEV_API_KEY: ${{ secrets.DEV_API_KEY }}
          DEV_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish || '1' }}
        run: node scripts/devto-sync.mjs

      - name: Sync to Juejin (Chinese .md, draft mode)
        env:
          JUEJIN_COOKIE: ${{ secrets.JUEJIN_COOKIE }}
          JUEJIN_UUID: ${{ secrets.JUEJIN_UUID }}
          JUEJIN_CSRF_TOKEN: ${{ secrets.JUEJIN_CSRF_TOKEN }}
        run: node scripts/juejin-sync.mjs
